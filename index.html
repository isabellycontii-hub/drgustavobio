/* ==========================================================================
   LINK DA BIO | Dr. Gustavo Rezende
   Pagina curta de decisao: marca, posicionamento, duas rotas.
   Paleta, tipografia e mobilia grafica vem do Manual de Identidade Visual.
   Mobile primeiro; o desktop e a mesma coluna, com mais respiro.
   ========================================================================== */
:root{
  --navy:#01152F; --blue:#0A2D55; --gold:#D69723; --goldl:#EBB23B; --golddk:#A9741A;
  --marfim:#F4EAD7;
  --sky:#EAF0F8; --sky-2:rgba(234,240,248,.72); --sky-3:rgba(234,240,248,.50);
  --grad:linear-gradient(100deg,#EBB23B 0%,#D69723 46%,#B87C13 100%);
  --serif:"Bodoni Moda",Didot,"Times New Roman",serif;
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --t:220ms cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--sky);background:var(--navy);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100svh;display:flex;flex-direction:column;
}

/* ---------- fundo: azul-marinho trabalhado + fotografia de ambiente ---------- */
.fundo{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(96% 42% at 84% 2%, rgba(214,151,35,.13) 0%, rgba(214,151,35,0) 58%),
    radial-gradient(92% 44% at 4% 98%, rgba(10,45,85,.85) 0%, rgba(10,45,85,0) 62%),
    radial-gradient(78% 36% at 50% 4%, rgba(19,60,108,.62) 0%, rgba(19,60,108,0) 72%),
    linear-gradient(168deg,#02182F 0%,#01142B 48%,#010C1D 100%);
}
.fundo .foto{position:absolute;inset:-2%;background-position:50% 34%;background-size:cover;
  filter:saturate(.68) contrast(1.04) brightness(.94) blur(1.4px);opacity:.46;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 34%,rgba(0,0,0,.34) 62%,transparent 88%);
          mask-image:linear-gradient(180deg,#000 0%,#000 34%,rgba(0,0,0,.34) 62%,transparent 88%)}
.fundo .veu{position:absolute;inset:0;background:
  linear-gradient(180deg,
    rgba(1,21,47,.62) 0%, rgba(1,20,43,.70) 26%, rgba(1,18,38,.88) 54%,
    rgba(1,14,30,.96) 78%, #010C1D 100%),
  radial-gradient(118% 52% at 50% 8%, rgba(10,45,85,.42) 0%, rgba(10,45,85,0) 72%)}
.fundo .grain{position:absolute;inset:0;opacity:.20;mix-blend-mode:overlay;
  background-image:var(--noise);background-size:180px 180px}

/* Com fotografia no fundo, o veu fecha um pouco mais e abre um bolsao escuro
   atras da marca: a foto vira ambientacao e a logo nunca disputa com ela.
   Estas regras so valem quando build.py encontra a foto; sem foto, sao inertes. */
.com-foto .foto{opacity:.36}
.com-foto .veu{background:
  linear-gradient(180deg,
    rgba(1,21,47,.70) 0%, rgba(1,20,43,.76) 26%, rgba(1,18,38,.90) 54%,
    rgba(1,14,30,.97) 78%, #010C1D 100%),
  radial-gradient(56% 25% at 50% 17%, rgba(2,17,36,.82) 0%, rgba(2,17,36,0) 76%),
  radial-gradient(118% 52% at 50% 8%, rgba(10,45,85,.34) 0%, rgba(10,45,85,0) 72%)}

/* ---------- moldura de curvas: o elemento grafico n 1 do manual ---------- */
.curvas,.fio{position:absolute;top:0;height:100%;pointer-events:none}
.curvas.r,.fio.r{right:-150px;width:250px}
.curvas.l,.fio.l{left:-140px;width:224px;transform:scaleX(-1)}
.curvas.r{-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 26%,#000 100%);
                  mask-image:linear-gradient(180deg,transparent 0%,#000 26%,#000 100%)}
.curvas.l{-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 48%,transparent 86%);
                  mask-image:linear-gradient(180deg,#000 0%,#000 48%,transparent 86%)}
.fio{opacity:.62}
.fio.r{-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%);
               mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%)}
.fio.l{-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 44%,transparent 82%);
               mask-image:linear-gradient(180deg,#000 0%,#000 44%,transparent 82%)}

/* ---------- coluna central ---------- */
.wrap{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  width:100%;max-width:430px;margin:0 auto;
  padding:calc(36px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
  gap:0}

/* ---------- marca ---------- */
.marca{width:min(62vw,238px);height:auto;display:block}
.marca-l{margin-bottom:13px}

/* registro profissional: o fecho da marca, nunca um texto que disputa com ela */
.crm{margin:0 0 24px;font-size:9.6px;font-weight:500;letter-spacing:.24em;
  color:rgba(234,240,248,.60)}

/* ---------- selo: filete, ponto, filete ---------- */
.selo{display:flex;align-items:center;justify-content:center;gap:15px;margin:0 0 26px}
.selo i{display:block;height:1px;width:64px;flex:none}
.selo i:first-child{background:linear-gradient(90deg,rgba(214,151,35,.06),rgba(214,151,35,.80))}
.selo i:last-child{background:linear-gradient(90deg,rgba(214,151,35,.80),rgba(214,151,35,.06))}
.selo b{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}

/* ---------- frase de impacto ---------- */
h1{font-family:var(--sans);font-weight:300;
  font-size:clamp(15px,4.02vw,17px);line-height:1.66;letter-spacing:.004em;
  color:var(--marfim);text-wrap:balance;max-width:19em}
h1 b{font-weight:500;color:var(--goldl)}

/* ---------- linha de especialidades ---------- */
.espec{margin:25px 0 0;font-size:clamp(8.9px,2.42vw,10px);font-weight:600;
  letter-spacing:.165em;text-transform:uppercase;color:rgba(235,178,59,.80);
  line-height:2;max-width:none}
.espec i{display:inline-block;width:2.5px;height:2.5px;border-radius:50%;background:currentColor;
  opacity:.70;margin:0 8px;vertical-align:middle;font-style:normal}
.espec u{display:block;height:0;overflow:hidden;text-decoration:none}

/* ---------- botoes ---------- */
.acoes{width:100%;margin-top:34px;display:flex;flex-direction:column;gap:14px}
.bt{display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:66px;padding:21px 24px;border-radius:4px;text-decoration:none;
  font-size:clamp(12.6px,3.5vw,14px);font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;line-height:1;
  transition:transform var(--t),box-shadow var(--t),background-color var(--t),
             border-color var(--t),color var(--t)}
.bt svg{flex:none}
.bt.pri{background:var(--grad);color:#06172E;letter-spacing:.15em;
  box-shadow:0 14px 34px -18px rgba(214,151,35,.62),0 1px 0 rgba(255,255,255,.22) inset}
.bt.sec{color:var(--sky);border:1.5px solid rgba(234,240,248,.38);
  background:rgba(234,240,248,.06);backdrop-filter:blur(2px)}
.bt.sec svg{opacity:.72;transition:transform var(--t),opacity var(--t)}
.bt:focus-visible{outline:2px solid var(--goldl);outline-offset:3px}
.bt:active{transform:translateY(1px) scale(.994)}
@media (hover:hover){
  .bt.pri:hover{transform:translateY(-2px);
    box-shadow:0 16px 34px -18px rgba(214,151,35,.68),0 1px 0 rgba(255,255,255,.26) inset}
  .bt.sec:hover{border-color:rgba(235,178,59,.68);color:var(--marfim);
    background:rgba(235,178,59,.07)}
  .bt.sec:hover svg{transform:translateX(3px);opacity:1}
}

/* ---------- localizacao ---------- */
.local{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;
  font-size:clamp(11.4px,3.05vw,12.4px);font-weight:300;color:var(--sky-2);letter-spacing:.012em}
.local b{font-weight:500;color:var(--sky)}

/* ---------- rodape ---------- */
.pe{position:relative;z-index:2;width:100%;max-width:430px;margin:0 auto;
  padding:0 22px calc(24px + env(safe-area-inset-bottom));text-align:center}
.pe hr{border:0;height:1px;margin:0 0 16px;
  background:linear-gradient(90deg,transparent,rgba(214,151,35,.30) 50%,transparent)}
.pe p{font-size:9.6px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;
  color:rgba(234,240,248,.52);line-height:2}
.pe p em{font-style:normal;color:rgba(235,178,59,.62)}

/* ---------- entrada suave ---------- */
.up{opacity:0;transform:translateY(14px);
  animation:up .82s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.17s}.d3{animation-delay:.28s}
.d4{animation-delay:.39s}.d5{animation-delay:.50s}.d6{animation-delay:.60s}.d7{animation-delay:.70s}

/* ---------- telas baixas: a pagina respira menos, nunca corta ---------- */
@media (max-height:690px){
  .marca{width:min(52vw,198px)}
  .marca-l{margin-bottom:10px}
  .crm{margin-bottom:18px}
  .selo{margin-bottom:20px}
  .espec{margin-top:18px}
  .acoes{margin-top:26px;gap:12px}
  .bt{min-height:60px;padding:18px 20px}
  .local{margin-top:20px}
}

/* ---------- desktop: a mesma coluna, com mais ar ---------- */
@media (min-width:860px){
  .wrap{max-width:620px;padding-top:44px;padding-bottom:28px}
  .pe{max-width:620px}
  .marca{width:274px}
  .marca-l{margin-bottom:14px}
  .crm{margin-bottom:28px;font-size:10.2px}
  .selo{margin-bottom:30px}
  .selo i{width:78px}
  h1{font-size:18px;line-height:1.7;max-width:24em}
  .espec{font-size:10.6px;letter-spacing:.20em;margin-top:30px;line-height:2.1}
  .acoes{margin-top:40px;max-width:480px;gap:15px}
  .bt{min-height:70px;padding:23px 28px;font-size:14.2px}
  .local{margin-top:30px;font-size:13.2px}
  .curvas.r,.fio.r{right:-40px;width:330px}
  .curvas.l,.fio.l{left:-60px;width:300px}
  .fundo .foto{background-position:50% 30%;opacity:.40}
  /* na tela larga a foto aparece muito maior, entao pesa menos */
  .com-foto .foto{opacity:.28}
}

/* ---------- quem pediu menos movimento, recebe menos ---------- */
@media (prefers-reduced-motion:reduce){
  .up{animation:none;opacity:1;transform:none}
  .bt,.bt.sec svg{transition:none}
